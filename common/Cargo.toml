[package]
name    = 'common'
version = '0.1.0'
edition = '2024'

[dependencies]
async-openai       = '0.30'
clap               = { version='4.5', features=['derive'] }
serde              = '1'
serde_json         = '1'
termcolor          = '1.4'
tracing            = '0.1'
tracing-subscriber = '0.3'
tokio              = { version='1', features=['macros', 'rt-multi-thread'] }
