[package]
name    = 'augment-prompt-prirate'
version = '0.1.0'
edition = '2024'

[dependencies]
async-openai = '0.30'
clap         = { version='4.5', features=['derive'] }
env_logger   = '0.11'
log          = '0.4'
serde        = '1'
serde_json   = '1'
tokio        = { version='1', features=['macros', 'rt-multi-thread'] }
