[workspace]
members  = [
  '01-hello-world',
  '05-augment-prompt-pirates',
  '05-augment-prompt-spanish-translation',
  '05-augment-prompt-grammar-checker',
  '05-multi-turn-dialogue',
  '05-state-with-memory-systems',
  '05-developer-message',
  '05-prompt-as-array',
]
resolver = '3'

[workspace.dependencies]
argh         = '0.1'
async-openai = { version='0.31', features=['responses'] }
serde        = '1'
serde_json   = '1'
termcolor    = '1.4'
tokio        = { version='1', features=['macros', 'rt-multi-thread'] }
